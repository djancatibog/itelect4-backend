# GT6: runs on every push, to any branch.
name: CI

on: push

jobs:
  test:
    # A fresh Linux machine from GitHub. Nothing from your laptop is on it.
    runs-on: ubuntu-latest

    steps:
      # Copies this repo, at the commit that was pushed.
      - uses: actions/checkout@v7

      # Installs Node 24 and keeps npm's download cache between runs.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Installs exactly what package-lock.json lists.
      - run: npm ci

      # The same check npm run build does, without writing dist/.
      - run: npm run typecheck

      # The Supertest file. .env is not in the repo, so JWT_SECRET
      # comes from the repository's Actions secrets instead.
      - run: npm test
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}